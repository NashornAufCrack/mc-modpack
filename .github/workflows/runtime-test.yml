name: Runtime-Start-Test
# Prüft Packs auf Startfähigkeit, Mixin-Kollisionen, Resource Packs und Chunks.
# Job 1: Statischer 2-Sekunden Pre-Check (Abhängigkeiten, Mixins, Breaks)
# Job 2: Headless Client Boot & Stresstest (Xvfb, Weltbeitritt, Chunk-Flug, Mobs, 3D-Items)

on:
  push:
    paths:
      - "data/files.json"
      - "data/mods.json"
      - "data/app-data.json"
      - "scripts/solve_pack_compatibility.py"
      - "scripts/prepare_headless_run.py"
      - ".github/workflows/runtime-test.yml"
  workflow_dispatch:
    inputs:
      preset:
        description: "Preset zu testen (plus, visual, perf, oder custom)"
        required: false
        default: "plus"
        type: choice
        options:
          - plus
          - visual
          - perf
          - custom
      mods:
        description: "Kommagetrennte Liste oder JSON von Mod-Slugs (wenn custom)"
        required: false
        default: ""
        type: string
      resourcepacks:
        description: "Kommagetrennte Liste oder JSON von Resource-Pack-Slugs"
        required: false
        default: ""
        type: string

concurrency:
  group: runtime-test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  static-precheck:
    name: "1. Statischer Kompatibilitäts- & Mixin-Precheck"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fabric Resolver & Kollisionstest ausführen
        run: python3 scripts/solve_pack_compatibility.py

  headless-runtime-test:
    name: "2. Headless Client-Stresstest (Welt-Flug & Resource Packs)"
    needs: static-precheck
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 21 (Temurin) einrichten
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Mod-JARs cachen
        uses: actions/cache@v4
        with:
          path: run/mods
          key: mc-mods-26-3-${{ hashFiles('data/files.json') }}
          restore-keys: |
            mc-mods-26-3-

      - name: Resource-Pack-ZIPs cachen
        uses: actions/cache@v4
        with:
          path: run/resourcepacks
          key: mc-rps-26-3-${{ hashFiles('data/files.json') }}
          restore-keys: |
            mc-rps-26-3-

      - name: Test-Umgebung vorbereiten (Mods, Resource Packs, options.txt & Stress-Datapack)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.preset }}" = "custom" ]; then
            python3 scripts/prepare_headless_run.py --mods "${{ inputs.mods }}" --resourcepacks "${{ inputs.resourcepacks }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/prepare_headless_run.py --preset "${{ inputs.preset }}"
          else
            python3 scripts/prepare_headless_run.py --preset "plus"
          fi

      - name: Mesa OpenGL / GLX Pakete installieren & Diagnose
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-utils libgl1-mesa-dri libglx-mesa0 libosmesa6 xvfb
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "SDL_VIDEO_DRIVER=x11" >> "$GITHUB_ENV"
          echo "SDL_VIDEODRIVER=x11" >> "$GITHUB_ENV"
          echo "SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER=skip" >> "$GITHUB_ENV"
          echo "=== GLXINFO TEST IN XVFB ==="
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" glxinfo | grep -E "OpenGL|direct rendering|server glx" || true
          echo "=== SDL / GLX VISUAL CHECK ==="
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" python3 -c '
          import ctypes
          try:
              gl = ctypes.CDLL("libGL.so.1")
              x11 = ctypes.CDLL("libX11.so.6")
              disp = x11.XOpenDisplay(None)
              if disp:
                  screen = x11.XDefaultScreen(disp)
                  GLX_RENDER_TYPE = 0x8011
                  GLX_RGBA_BIT = 0x00000001
                  GLX_RED_SIZE = 8
                  GLX_GREEN_SIZE = 9
                  GLX_BLUE_SIZE = 10
                  GLX_DEPTH_SIZE = 12
                  GLX_DOUBLEBUFFER = 5
                  GLX_FRAMEBUFFER_SRGB_CAPABLE_ARB = 0x20B2
                  
                  # 1. Ohne sRGB
                  a1 = (ctypes.c_int * 13)(GLX_RENDER_TYPE, GLX_RGBA_BIT, GLX_RED_SIZE, 3, GLX_GREEN_SIZE, 3, GLX_BLUE_SIZE, 2, GLX_DEPTH_SIZE, 16, GLX_DOUBLEBUFFER, 1, 0)
                  c1 = ctypes.c_int(0)
                  gl.glXChooseFBConfig.restype = ctypes.c_void_p
                  r1 = gl.glXChooseFBConfig(disp, screen, a1, ctypes.byref(c1))
                  print(f"  -> FBConfigs OHNE sRGB: {c1.value}")
                  
                  # 2. Mit sRGB
                  a2 = (ctypes.c_int * 15)(GLX_RENDER_TYPE, GLX_RGBA_BIT, GLX_RED_SIZE, 3, GLX_GREEN_SIZE, 3, GLX_BLUE_SIZE, 2, GLX_DEPTH_SIZE, 16, GLX_DOUBLEBUFFER, 1, GLX_FRAMEBUFFER_SRGB_CAPABLE_ARB, 1, 0)
                  c2 = ctypes.c_int(0)
                  r2 = gl.glXChooseFBConfig(disp, screen, a2, ctypes.byref(c2))
                  print(f"  -> FBConfigs MIT sRGB: {c2.value}")
          except Exception as e:
              print("Check failed:", e)
          ' || true

      - name: Headless Minecraft Client starten (Xvfb + mc-runtime-test)
        uses: headlesshq/mc-runtime-test@5.0.0
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          SDL_VIDEO_DRIVER: "x11"
          SDL_VIDEODRIVER: "x11"
          SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER: "skip"
        with:
          mc: "26.3"
          modloader: "fabric"
          java: "21"
          mc-runtime-test: "fabric"
          dummy-assets: true
          cache-mc: "github"
          xvfb: true
          headlessmc-command: '--retries 1 --jvm "-Xmx3G -Djava.awt.headless=false -DMcRuntimeGameTest=false -Dsodium.checks.issue2561=false"'

      - name: Test-Logs sichern (bei Fehler oder Abbruch)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-logs
          path: |
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
