name: Runtime-Start-Test
# Prüft Packs auf Startfähigkeit, Mixin-Kollisionen, Resource Packs und Chunks.
# Job 1: Statischer 2-Sekunden Pre-Check (Abhängigkeiten, Mixins, Breaks)
# Job 2: Headless Client Boot & Stresstest (Xvfb, Weltbeitritt, Chunk-Flug, Mobs, 3D-Items)

on:
  push:
    paths:
      - "data/files.json"
      - "data/mods.json"
      - "data/app-data.json"
      - "scripts/solve_pack_compatibility.py"
      - "scripts/prepare_headless_run.py"
      - ".github/workflows/runtime-test.yml"
  workflow_dispatch:
    inputs:
      preset:
        description: "Preset zu testen (plus, visual, perf, oder custom)"
        required: false
        default: "plus"
        type: choice
        options:
          - plus
          - visual
          - perf
          - custom
      mods:
        description: "Kommagetrennte Liste oder JSON von Mod-Slugs (wenn custom)"
        required: false
        default: ""
        type: string
      resourcepacks:
        description: "Kommagetrennte Liste oder JSON von Resource-Pack-Slugs"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: runtime-test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  static-precheck:
    name: "1. Statischer Kompatibilitäts- & Mixin-Precheck"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fabric Resolver & Kollisionstest ausführen
        run: python3 scripts/solve_pack_compatibility.py

  headless-runtime-test:
    name: "2. Headless Client-Stresstest (Welt-Flug & Resource Packs)"
    needs: static-precheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 21 (Temurin) einrichten
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Mod-JARs cachen
        uses: actions/cache@v4
        with:
          path: run/mods
          key: mc-mods-26-3-${{ hashFiles('data/files.json') }}
          restore-keys: |
            mc-mods-26-3-

      - name: Resource-Pack-ZIPs cachen
        uses: actions/cache@v4
        with:
          path: run/resourcepacks
          key: mc-rps-26-3-${{ hashFiles('data/files.json') }}
          restore-keys: |
            mc-rps-26-3-

      - name: Test-Umgebung vorbereiten (Mods, Resource Packs, options.txt & Stress-Datapack)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRESET: ${{ inputs.preset }}
          MODS: ${{ inputs.mods }}
          RESOURCEPACKS: ${{ inputs.resourcepacks }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PRESET" = "custom" ]; then
            if [ ${#MODS} -gt 16384 ] || [ ${#RESOURCEPACKS} -gt 16384 ]; then
              echo "Eingabeliste zu lang" >&2
              exit 1
            fi
            MODS_RE='^[A-Za-z0-9_.," \[\]-]*$'
            if ! [[ "$MODS" =~ $MODS_RE ]] || ! [[ "$RESOURCEPACKS" =~ $MODS_RE ]]; then
              echo "Ungueltige Zeichen in mods/resourcepacks" >&2
              exit 1
            fi
            python3 scripts/prepare_headless_run.py --mods="$MODS" --resourcepacks="$RESOURCEPACKS"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$PRESET" =~ ^(perf|visual|plus)$ ]]; then
              echo "Ungueltiges Preset: $PRESET" >&2
              exit 1
            fi
            python3 scripts/prepare_headless_run.py --preset="$PRESET"
          else
            python3 scripts/prepare_headless_run.py --preset "plus"
          fi

      - name: Mesa OpenGL / GLX Pakete & Treiber einrichten
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-utils libgl1-mesa-dri libglx-mesa0 libosmesa6 xvfb
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "SDL_VIDEO_DRIVER=x11" >> "$GITHUB_ENV"
          echo "SDL_VIDEODRIVER=x11" >> "$GITHUB_ENV"
          echo "SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER=skip" >> "$GITHUB_ENV"

      - name: Headless Minecraft Client starten (Xvfb + mc-runtime-test)
        uses: headlesshq/mc-runtime-test@5.0.0
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          SDL_VIDEO_DRIVER: "x11"
          SDL_VIDEODRIVER: "x11"
          SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER: "skip"
        with:
          mc: "26.3"
          modloader: "fabric"
          java: "21"
          mc-runtime-test: "fabric"
          dummy-assets: true
          cache-mc: "github"
          xvfb: true
          headlessmc-command: '--retries 1 --jvm "-Xmx8G -Djava.awt.headless=false -DMcRuntimeGameTest=false -Dsodium.checks.issue2561=false"'

      - name: Test-Logs sichern (bei Fehler oder Abbruch)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-logs
          path: |
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
