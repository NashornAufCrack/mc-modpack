name: Hörproben
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"
  push:
    paths:
      - "scripts/sounds.py"
permissions:
  contents: write
concurrency: sounds
jobs:
  sounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq install -y ffmpeg >/dev/null
      - run: python3 scripts/sounds.py
      - run: |
          git config user.name "hoerproben"
          git config user.email "actions@users.noreply.github.com"
          git add -A sounds data/sounds.json
          git diff --cached --quiet || git commit -m "Hörproben $(date +%F)"
          for i in 1 2 3 4; do git pull --rebase -X theirs -q && git push && break; sleep $((i*7)); done
