name: Medien
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/media.mjs"
      - "scripts/media-app.mjs"
      - ".github/workflows/media.yml"
permissions:
  contents: write
concurrency: media
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -q yt-dlp
      - run: node scripts/media.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - run: |
          git config user.name "medien-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data/media.json data/media-app.json data/media-stand.json data/media-dims.json
          git diff --cached --quiet || git commit -m "Medien $(date +%F)"
          for i in 1 2 3 4; do git pull --rebase -X theirs -q && git push && break; sleep $((i*7)); done
