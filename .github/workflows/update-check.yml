name: Update-Check
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-updates.mjs
      - run: |
          git config user.name "update-check"
          git config user.email "actions@users.noreply.github.com"
          git add data/updates.json
          git diff --cached --quiet || git commit -m "Update-Check $(date +%F)"
          git push
