name: Update-Check
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Modrinth Update-Check"
        run: node scripts/check-updates.mjs
      - name: "GitHub Early Releases Scanner"
        run: python3 scripts/check_github_releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Mixin-Kollisionsscan & Schutz (Bytecode-Ebene)"
        run: python3 scripts/mixin_scan.py guard
      - name: "Resourcepack-Check"
        run: python3 scripts/rpcheck.py
      - name: "Start-Sicherheit & Kompatibilitätsprüfung aller Packs"
        run: python3 scripts/solve_pack_compatibility.py
      - name: "Katalog-Integritätsprüfung"
        run: python3 qa/datacheck.py --ci
      - run: |
          git config user.name "update-check"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4; do
            git add data/updates.json data/updates.xml data/files.json data/app-data.json data/rp-check.json data/github-early-releases.json data/mixin-held.json data/mixin-index.json data/mixin-conflicts.json quelle/files.json UPDATES.md
            git diff --cached --quiet && break
            git commit -q -m "Update-Check $(date +%F)"
            git push -q && break
            # Inzwischen hat jemand gepusht: nichts überschreiben, sondern auf dem neuen Stand neu rechnen
            sleep $((i*7)); git fetch -q origin main && git reset -q --hard origin/main
            node scripts/check-updates.mjs && python3 scripts/check_github_releases.py && python3 scripts/mixin_scan.py guard && python3 scripts/rpcheck.py && python3 scripts/solve_pack_compatibility.py
          done
