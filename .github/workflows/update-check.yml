name: Update-Check
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-updates.mjs
      - run: python3 scripts/rpcheck.py
      - run: |
          git config user.name "update-check"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4; do
            git add data/updates.json data/updates.xml data/files.json data/app-data.json data/rp-check.json quelle/files.json UPDATES.md
            git diff --cached --quiet && break
            git commit -q -m "Update-Check $(date +%F)"
            git push -q && break
            # Inzwischen hat jemand gepusht: nichts überschreiben, sondern auf dem neuen Stand neu rechnen
            sleep $((i*7)); git fetch -q origin main && git reset -q --hard origin/main
            node scripts/check-updates.mjs && python3 scripts/rpcheck.py
          done
