name: Update-Check
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-updates.mjs
      - run: python3 scripts/rpcheck.py
      - run: |
          git config user.name "update-check"
          git config user.email "actions@users.noreply.github.com"
          git add data/updates.json data/files.json data/app-data.json data/rp-check.json UPDATES.md
          git diff --cached --quiet || git commit -m "Update-Check $(date +%F)"
          for i in 1 2 3 4; do git pull --rebase -X theirs -q && git push && break; sleep $((i*7)); done
