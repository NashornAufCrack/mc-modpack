name: Erweitern
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/expand.mjs"
      - ".github/workflows/expand.yml"
permissions:
  contents: write
concurrency: data
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/expand.mjs | tee data/expand-log.txt
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - run: |
          git config user.name "erweitern"
          git config user.email "actions@users.noreply.github.com"
          git add data/auto.json data/expand-log.txt cf
          git diff --cached --quiet || git commit -m "Erweitern $(date +%F)"
          git pull --rebase -q || true
          git push
