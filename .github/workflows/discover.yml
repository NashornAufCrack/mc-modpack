name: Kandidaten
on:
  workflow_dispatch:
  schedule:
    - cron: "35 4 * * *" # Täglich um 04:35 UTC: sucht täglich nach neuen gehypten Mods, Packs & Social-Media-Trends
  push:
    paths:
      - "scripts/discover.mjs"
      - "scripts/discover_social.py"
      - ".github/workflows/discover.yml"
permissions:
  contents: write
concurrency: discover
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: node scripts/discover.mjs | tee data/discover-log.txt
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - run: python3 scripts/discover_social.py
      - run: |
          git config user.name "kandidaten"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json data/discover-log.txt data/social-hype.json
          git diff --cached --quiet || git commit -m "Kandidaten & Social-Hype $(date +%F)"
          git pull --rebase -q || true
          git push
