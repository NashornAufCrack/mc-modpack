name: Prüfbögen
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: data
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && rm -f review/sheet-* && python3 scripts/reviewsheet.py
      - run: |
          git config user.name "pruefboegen"
          git config user.email "actions@users.noreply.github.com"
          git add -A review
          git diff --cached --quiet || git commit -m "Prüfbögen $(date +%F)"
          git pull --rebase -q || true
          git push
