name: Prüfbögen
on:
  workflow_dispatch:
permissions: {}
concurrency: reviewsheet
jobs:
  sheets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && rm -f review/sheet-* && python3 scripts/reviewsheet.py
      - run: |
          git config user.name "pruefboegen"
          git config user.email "actions@users.noreply.github.com"
          git add -A review
          git diff --cached --quiet || git commit -m "Prüfbögen $(date +%F)"
          for i in 1 2 3 4; do git pull --rebase -X theirs -q && git push && break; sleep $((i*7)); done
