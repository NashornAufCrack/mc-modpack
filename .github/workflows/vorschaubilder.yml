name: Vorschaubilder
# YouTube-Vorschaubilder selbst hosten (media/yt/), damit beim Stöbern keine Anfrage an Google geht.
# Läuft nach jedem Medien-Lauf, bei Änderungen am Skript und von Hand; lädt nur fehlende Bilder.
on:
  workflow_run:
    workflows: ["Medien"]
    types: [completed]
  push:
    paths:
      - "scripts/yt-thumbs.py"
      - ".github/workflows/vorschaubilder.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency: vorschaubilder
jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Bilder laden und Merker setzen"
        run: |
          pip install -q pillow
          python3 scripts/yt-thumbs.py
          node scripts/media-app.mjs
      - name: "Speichern"
        run: |
          git config user.name "vorschaubilder"
          git config user.email "actions@users.noreply.github.com"
          git add media/yt data/media-app.json
          git diff --cached --quiet && { echo "Nichts Neues."; exit 0; }
          git commit -q -m "Vorschaubilder $(date +%F)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            # media-app.json geändert (z. B. neuer Medien-Lauf): Merker auf dem neuen Stand neu setzen
            git reset -q --hard origin/main && git checkout -q HEAD@{1} -- media/yt 2>/dev/null || true
            node scripts/media-app.mjs && git add media/yt data/media-app.json && git commit -q -m "Vorschaubilder $(date +%F)" || exit 0
            sleep $((i * 5))
          done
          exit 1
