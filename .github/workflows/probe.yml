name: Abfrage
# Holt beliebige öffentliche URLs (z. B. Modrinth-API) und legt die Antworten unter probe/ ab.
# Grund: Die Arbeitsumgebung von Claude erreicht api.modrinth.com nicht direkt.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs, durch Leerzeichen getrennt"
        required: true
permissions: {}
concurrency: probe
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          URLS: ${{ inputs.urls }}
        run: |
          rm -rf probe && mkdir -p probe
          i=0
          HTTPS_RE='^https://[^[:space:]]+$'
          for u in $URLS; do
            if ! [[ "$u" =~ $HTTPS_RE ]]; then
              echo "Nur https://-URLs erlaubt: $u" >&2
              exit 1
            fi
            i=$((i+1))
            printf '%s\n' "$u" > "probe/$i.url"
            curl -sSL --max-time 60 -A "NashornAufCrack/mc-modpack probe (github.com/NashornAufCrack/mc-modpack)" -- "$u" -o "probe/$i.txt" || echo "FEHLER" > "probe/$i.txt"
          done
      - run: |
          git config user.name "abfrage"
          git config user.email "actions@users.noreply.github.com"
          git add -A probe
          git diff --cached --quiet || git commit -m "Abfrage $(date +%F-%H%M)"
          for i in 1 2 3 4; do git pull --rebase -X theirs -q && git push && break; sleep $((i*7)); done
