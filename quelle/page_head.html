<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --g:#7FCB83; --g-bg:#1E3220; --y:#E2B451; --y-bg:#3A2F14; --r:#EE8A8A; --r-bg:#3C1E1E; --q:#B9A2EC; --q-bg:#2C2440; color-scheme:dark}}
:root[data-theme="dark"]{

  --g:#7FCB83; --g-bg:#1E3220; --y:#E2B451; --y-bg:#3A2F14; --r:#EE8A8A; --r-bg:#3C1E1E; --q:#B9A2EC; --q-bg:#2C2440; color-scheme:dark}
*{box-sizing:border-box}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
header h1{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.bar input[type=search]{flex:1 1 220px;min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);font:inherit}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);margin:14px 0 4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.G{background:var(--g)}.dot.Y{background:var(--y)}.dot.R{background:var(--r)}.dot.Q{background:var(--q)}

h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 6px;font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.row{display:grid;grid-template-columns:minmax(0,17rem) 8.5rem minmax(0,1fr) 6.5rem;gap:12px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}

.dl{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

.views a{white-space:nowrap;padding:8px 12px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}

.toc{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}

.toc a:hover{border-color:var(--accent)}
.sgroup{scroll-margin-top:16px}
.where{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);margin:2px 0 6px}
.srow{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,13rem) minmax(0,1fr);gap:12px;padding:9px 14px;border-top:1px solid var(--line);align-items:baseline}
.srow:first-child{border-top:0}
.shead{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.sval{font-weight:500;color:var(--accent);min-width:0}

.def,.key{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:400;margin-top:2px;overflow-wrap:anywhere}
.foot{color:var(--muted);font-size:.85rem;margin-top:28px}
.ovlink{margin-left:6px;font-size:.72rem;color:var(--y);text-decoration:none;border-bottom:1px dotted var(--y)}
.lead{margin-top:18px}
.tag{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:3px;white-space:nowrap}
.tag.K{color:var(--r);background:var(--r-bg)}.tag.D{color:var(--y);background:var(--y-bg)}.tag.T{color:var(--q);background:var(--q-bg)}.tag.A{color:var(--accent);background:var(--surface);border:1px solid var(--accent)}.tag.S{color:var(--g);background:var(--g-bg)}
.orow{display:grid;grid-template-columns:minmax(0,19rem) minmax(0,1fr);gap:14px;padding:11px 14px;border-top:1px solid var(--line)}

.dec-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}

.who{font-size:.78rem;color:var(--g);margin-left:auto}
.frage{margin:6px 0 12px;max-width:75ch}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}

.file{display:inline-flex;align-self:start;width:max-content;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:.85rem}

.brow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);cursor:pointer}

.bname{font-weight:600;flex:1 1 10rem;min-width:0}

  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;gap:10px;justify-content:space-between;align-items:center;background:var(--fg);color:var(--bg);text-decoration:none;font-size:.85rem;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  #view-build{padding-bottom:56px} }
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.thumbs img,.gal img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block;max-width:100%}

.link2{background:none;border:0;padding:0;font:600 .95rem var(--f-body);color:var(--fg);cursor:pointer;text-align:left}
